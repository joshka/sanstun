[package]
name = "sanstun-drivers"
description = "Event loops that drive sanstun, for comparing sans-IO and async designs"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
# Keeps libtest from rejecting criterion's arguments in `cargo bench`.
bench = false

[dependencies]
sanstun = { path = "..", features = ["tokio"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1.54", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
zeroize = "1.5.6"

[dev-dependencies]
criterion = "0.8.2"
proptest = "1"
tokio = { version = "1.54", features = ["test-util"] }

[[bench]]
name = "e2e"
harness = false

[[bench]]
name = "primitives"
harness = false
